# muster's own profile: muster checks its own source tree with it.
schema = 1

[source]
roots   = ["src"]
tests   = ["tests"]
include = ["**/*.py"]

[zones]
base     = "src"
critical = "policy/critical.txt"
standard = "policy/standard.txt"

# The language of muster's own files, for the loc command; a docstring counts as code.
[[language]]
name         = "python"
extensions   = [".py"]
line_comment = "#"
