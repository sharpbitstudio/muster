name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks honours a .gitleaksignore inside the scanned path, whatever
      # flags it gets, so the scan refuses to run when one exists.
      - name: No .gitleaksignore
        run: |
          if [ -n "$(find . -path ./.git -prune -o -iname .gitleaksignore -print -quit)" ]; then
            echo "::error::.gitleaksignore is not allowed in this repository"
            exit 1
          fi

      # The config is generated here, never read from the checkout.
      - name: Write gitleaks config
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          echo "27630a96d6c55755cc37620f3933d5cab94b1eb78a726a32e11212972525d76e  $RUNNER_TEMP/gitleaks.toml" | sha256sum -c -

      # The checkout belongs to the runner user, not to the container user, so
      # git inside the container would refuse it as "dubious ownership". The
      # GIT_CONFIG_* variables mark only /repo as safe, in command scope.
      #
      # gitleaks exits 0 when git fails or the path is missing, so each scan
      # step also fails unless its log shows an actual scan and no error. The
      # log lines carry ANSI colour codes even without a TTY; they are
      # stripped before matching. A finding still fails through the exit code.
      - name: gitleaks git (all fetched refs, first-parent diffs)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/gitleaks-git.log"
          rc=0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks.toml:/config/gitleaks.toml:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo \
            --config /config/gitleaks.toml \
            --log-opts="--all --full-history --diff-merges=first-parent" \
            --ignore-gitleaks-allow --redact --no-banner 2>&1 | tee "$log" || rc=$?
          plain="$(sed 's/\x1b\[[0-9;]*m//g' "$log")"
          if grep -Eq '^[^ ]+ (ERR|FTL) ' <<< "$plain"; then
            echo "::error::gitleaks logged an error"
            exit 1
          fi
          if ! grep -Eq '^[^ ]+ INF [1-9][0-9]* commits scanned' <<< "$plain"; then
            echo "::error::gitleaks did not report any scanned commit"
            exit 1
          fi
          exit "$rc"

      # The default config skips some paths (for example *.svg, a file named
      # gitleaks.toml at any depth, or anything under node_modules/) and never
      # reads commit, tag or tree objects. Every object reachable from any ref
      # is therefore written into a stream, objects.txt, as a record after a
      # separator: blobs, commits (headers and message) and annotated tags
      # raw. Then come the names: every distinct entry name of any tree,
      # every distinct path name that "git rev-list --objects --all" gives,
      # and every distinct complete path of a file, folder or submodule in
      # any reachable tree (the tree of each commit and any tree a tag
      # points at, walked with the path prefix of each folder), each as a
      # record of its own (header "name"), in sorted order. rev-list gives
      # each object one path only, and a credential can run across folder
      # names (base64 holds "/"): when two paths share a blob or a folder,
      # the one that forms the credential may be the path rev-list does not
      # give. A tree gives no record of its own. Each name is its own record
      # so that the separator stops a match from running across names, as
      # it does across objects (see below): otherwise crafted names could
      # form one match that spans several of them and that a rule's
      # allowlist then drops, with a real secret in a name in the middle.
      #
      # gitleaks 8.30.1 reads a file in chunks of 100000 bytes; when a chunk
      # does not end in two newlines, it reads on to the next blank line, at
      # most 25000 bytes (sources/file.go and sources/common.go). Each chunk
      # is matched on its own and chunks do not overlap, so a secret across a
      # chunk end is not found. Each stream is therefore laid out in blocks of
      # exactly 100000 bytes, each ending in at least two newlines: every read
      # ends at a block end without reading on, and each block is one chunk.
      # A record that does not fit in what is left of a block starts the next
      # block; the rest is filled with newlines. A record is written whole
      # when it fits in one block with its separator, the longest header (a
      # SHA-256 id and an offset) and two newlines of padding: up to 98857
      # bytes of data. So every object up to that size lies whole in one
      # chunk, as a file of that size does in a file scan. A longer record is
      # split into slices of 98857 bytes that start every 49428 bytes, the
      # last one ending at the end of the record; each slice is a record of
      # its own, its header naming the object and the offset of the slice,
      # and fits in a block with its separator. A match of up to 49428 bytes
      # (half a slice, more than three times a 16384-bit RSA private key
      # block) thus lies whole in one slice. gitleaks applies the keywords of
      # a rule per chunk (see below), so in an object larger than one block
      # a keyword and a match more than half a slice apart can be missed, as
      # a file scan misses them across its own chunk ends in a file over
      # 100000 bytes.
      #
      # gitleaks skips a file whose first chunk looks like an application/*
      # type, and some of those signatures are plain ASCII text. It checks
      # only until it has read a newline, so each stream starts with a block
      # of 100000 newlines and nothing after it is checked.
      #
      # A match may start in one record and run into the next; when a rule's
      # allowlist then drops it (the Kubernetes rule drops any match that
      # holds "\n---\n"), the next record's own match is never tried. So 1024
      # newlines come before every separator. A bounded window of the default
      # rules spans at most 300 newlines (the Kubernetes rule). Where an
      # unbounded \s* or \s+ can take the newlines, the rule next needs text
      # that the "---" line does not give (a key and a colon, a value, "=>"
      # or "/>"), and the jwt-base64 class stops at the barrier line below.
      # Two rules run on, unbounded, to a closing marker or quote:
      # private-key to "KEY-----", curl-auth-user to a quote followed by a
      # space. So a barrier line "'KEY----- follows the newlines: its quotes
      # are followed by no space and it holds the marker, so both matches end
      # inside the separator. Every record ends in a newline and none starts
      # a chunk, so a rule anchored at the end or start of the text, with no
      # alternative that takes a newline, can match a file but not its
      # record. In the default config only sidekiq-sensitive-url is one: it
      # ends in (?:[\/|\#|\?|:]|$), so a blob that ends in such a URL without
      # a newline, held only in history or under a skipped path, is not found
      # here (the history scan still sees one outside the skipped paths).
      #
      # gitleaks applies the keywords of a rule to a whole chunk, and a chunk
      # here is a block of many records: once one record holds a keyword of
      # a rule, the rule runs over every record of the block. One default
      # rule takes a bare string of 40 hex digits, which every SHA-1 object
      # id is. So the builder never writes a bare object id of its own: a
      # record header names its object by the id broken in two by a dot, a
      # name record holds only the name (a rev-list line gives its path, not
      # its id), and in the header lines of a raw commit or tag (up to the
      # first empty line) the id of a tree, parent or object line, also of
      # the tag inside a mergetag header, is broken the same way, but only
      # when it is the id of an object the builder has listed itself. A real
      # object id is no secret; any other value, such as an extra "object"
      # header line that git accepts in a commit, is scanned as written.
      # Every other header line, the signatures and the message stay raw.
      # What is left fails closed: a keyword in one record and a real 40-hex
      # value in another record of the same block, such as the pinned commit
      # of an action, still give a finding, and so does the object line of a
      # tag inside a mergetag header when that object is not in the
      # repository.
      #
      # After any bump of the gitleaks image, re-check the rules for windows
      # that can cross the separator or exceed half a slice, the chunk size
      # and the read-on limit, whether keywords still apply per chunk (in an
      # object larger than one block, a keyword and a match more than half a
      # slice apart can be missed, as a file scan misses them across its own
      # chunk ends in a file over 100000 bytes), rules anchored at the end or
      # start of text, rules that match a bare object id, the path regexes
      # below and the path-only rules.
      #
      # Four rules of the default config fire only on a path that matches
      # their path regex: kubernetes-secret-yaml (?i)\.ya?ml$,
      # hashicorp-tf-password (?i)\.(?:tf|hcl)$, freemius-secret-key
      # (?i)\.php$ and nuget-config-password (?i)nuget\.config$. The trees
      # are read for the names each blob has in any reachable tree, and each
      # of the four rules gets a stream of its own (objects.yaml, objects.tf,
      # objects.php, nuget.config) that holds only the blobs with a name
      # matching its regex. The rule thus sees a blob as gitleaks would see a
      # file at that path: a file under a skipped path (node_modules/x.yaml)
      # is still covered, and other text is not. A stream without records
      # holds only its lead. No name is on a path allowlist, has an archive
      # extension, or matches a rule that fires on the path alone (such as
      # *.p12), so those path-only rules never fire on a stream; the builder
      # checks them by name instead (in the default config only pkcs12-file,
      # (?i)(?:^|\/)[^\/]+\.p(?:12|fx)$): every name a blob has in any
      # reachable tree, and on a match the step fails, naming the rule but not
      # the file. Every rule runs on every stream, so a finding of another
      # rule in a routed blob shows up more than once. gitleaks can skip a
      # file it cannot read without logging an error, so the scan must report
      # exactly the bytes of all five streams, which the builder writes down.
      - name: gitleaks dir (every object, in streams)
        run: |
          set -o pipefail
          objects="$RUNNER_TEMP/objects"
          list="$RUNNER_TEMP/object-list"
          total="$RUNNER_TEMP/objects-bytes"
          mkdir "$objects"
          git rev-list --objects --all --no-object-names \
            | git cat-file --batch-check='%(objecttype) %(objectname)' > "$list"
          if grep -Evq '^(blob|tree|commit|tag) ([0-9a-f]{40}|[0-9a-f]{64})$' "$list"; then
            echo "::error::unexpected line in the object list"
            exit 1
          fi
          python3 -I - "$list" "$objects" "$total" <<'PY'
          import os, re, subprocess, sys

          BLOCK = 100000  # the read size of gitleaks, see above
          SEP = b"\n" * 1024 + b"\"'KEY-----\n---\n"
          # The longest record header: the longest type, a SHA-256 id broken
          # by a dot, and an offset of up to 20 digits.
          HEADER = len(b"commit ") + 65 + len(b" offset ") + 20
          # The most data that fits in one block with the separator, the
          # longest header, two newlines around the data and two of padding.
          # A record up to that size is written whole; a longer one in slices
          # of that size that start every half of it.
          SLICE = BLOCK - len(SEP) - HEADER - 2 - 2
          STEP = SLICE // 2
          # The path regexes of the path-bound rules, with Go's $ written as \Z.
          ROUTES = (
              ("objects.yaml", rb"(?i)\.ya?ml\Z"),  # kubernetes-secret-yaml
              ("objects.tf", rb"(?i)\.(?:tf|hcl)\Z"),  # hashicorp-tf-password
              ("objects.php", rb"(?i)\.php\Z"),  # freemius-secret-key
              ("nuget.config", rb"(?i)nuget\.config\Z"),  # nuget-config-password
          )
          # The rules that fire on the path alone, as a regex for the full name
          # of a tree entry; gitleaks matches the whole path, which ends in it.
          PATH_ONLY = (
              ("pkcs12-file", rb"(?i)[^/]+\.p(?:12|fx)"),
          )
          OID = rb"[0-9a-f]{40}|[0-9a-f]{64}"
          # A header line of a commit or tag that names an object, also one of
          # the tag inside a mergetag header: its first line, then indented.
          ID_LINE = re.compile(rb"((?: ?(?:tree|parent|object)|mergetag object) )(" + OID + rb")")


          def fail(msg):
              print("::error::" + msg)
              sys.exit(1)


          class Stream:
              """One file: a lead block of newlines, then records in blocks."""

              def __init__(self, name):
                  self.name = name
                  self.out = open(os.path.join(sys.argv[2], name), "wb")
                  self.out.write(b"\n" * BLOCK)
                  self.blocks, self.used, self.records = 1, BLOCK, 0

              def put(self, header, data):
                  """Writes data as one record, or as overlapping slices."""
                  off = 0
                  while True:
                      head = header if len(data) <= SLICE else b"%s offset %d" % (header, off)
                      rec = SEP + head + b"\n" + data[off:off + SLICE] + b"\n"
                      if len(rec) > BLOCK - 2:
                          fail("record longer than a block")
                      if self.used + len(rec) > BLOCK - 2:
                          self.out.write(b"\n" * (BLOCK - self.used))
                          self.blocks += 1
                          self.used = 0
                      self.out.write(rec)
                      self.used += len(rec)
                      self.records += 1
                      if off + SLICE >= len(data):
                          return
                      off += STEP

              def close(self):
                  self.out.write(b"\n" * (BLOCK - self.used))
                  self.out.close()
                  size = os.path.getsize(self.out.name)
                  if size != self.blocks * BLOCK:
                      fail("stream size is not a whole number of blocks")
                  return size


          def broken(oid):
              """An object id broken by a dot, so that no rule takes it for a bare hex value."""
              half = len(oid) // 2
              return oid[:half] + b"." + oid[half:]


          def unbare(raw, known):
              """A raw commit or tag whose header lines name no object of known by a bare id."""
              lines = raw.split(b"\n")
              for i, line in enumerate(lines):
                  if not line:
                      break
                  m = ID_LINE.fullmatch(line)
                  if m and m.group(2) in known:
                      lines[i] = m.group(1) + broken(m.group(2))
              return b"\n".join(lines)


          def cat(kind, oid):
              """The raw content of one object, read through git cat-file."""
              git.stdin.write(oid + b"\n")
              git.stdin.flush()
              head = git.stdout.readline()
              prefix = oid + b" " + kind + b" "
              size = head[len(prefix):-1]
              if not head.startswith(prefix) or not head.endswith(b"\n") or not size.isdigit():
                  fail("unexpected output of git cat-file")
              data = git.stdout.read(int(size))
              if len(data) != int(size) or git.stdout.read(1) != b"\n":
                  fail("short output of git cat-file")
              return data


          def entries(raw, id_len):
              """(name, hex id, is a folder) of each entry of a raw tree object."""
              out, pos = [], 0
              while pos < len(raw):
                  space = raw.index(b" ", pos)
                  nul = raw.index(b"\0", space)
                  end = nul + 1 + id_len
                  if not re.fullmatch(rb"[0-7]+", raw[pos:space]) or nul == space + 1 or end > len(raw):
                      fail("unexpected tree entry")
                  folder = int(raw[pos:space], 8) & 0o170000 == 0o040000
                  out.append((raw[space + 1:nul], raw[nul + 1:end].hex().encode(), folder))
                  pos = end
              return out


          with open(sys.argv[1], "rb") as f:
              objects = [line.split(b" ") for line in f.read().split(b"\n") if line]
          known = {oid for _, oid in objects}
          git = subprocess.Popen(["git", "cat-file", "--batch"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          # First the trees, kept for the walk of complete paths below: the
          # names each blob has in any reachable tree, and every entry name for
          # the name records.
          trees, blob_names = {}, {}
          all_names = set()
          for kind, oid in objects:
              if kind == b"tree":
                  trees[oid] = entries(cat(kind, oid), len(oid) // 2)
                  for name, entry, _ in trees[oid]:
                      blob_names.setdefault(entry, set()).add(name)
                      all_names.add(name)
          names = {name for kind, oid in objects if kind == b"blob" for name in blob_names.get(oid, ())}
          for rule, rx in PATH_ONLY:
              if any(re.fullmatch(rx, name) for name in names):
                  fail(f"a blob has a name that matches the path-only rule {rule}")
          everything = Stream("objects.txt")
          routes = [(Stream(name), re.compile(rx)) for name, rx in ROUTES]
          roots = []  # the tree of each commit, and each tree a tag points at
          for kind, oid in objects:
              if kind == b"tree":
                  continue  # its entry names are name records, below
              data = cat(kind, oid)
              if kind == b"commit":
                  m = re.match(rb"tree (" + OID + rb")\n", data)
                  if not m or m.group(1) not in trees:
                      fail("unexpected tree line in a commit")
                  roots.append(m.group(1))
              elif kind == b"tag":
                  m = re.match(rb"object (" + OID + rb")\ntype ([a-z]+)\n", data)
                  if not m or (m.group(2) == b"tree" and m.group(1) not in trees):
                      fail("unexpected object line in a tag")
                  if m.group(2) == b"tree":
                      roots.append(m.group(1))
              if kind != b"blob":
                  data = unbare(data, known)
              header = kind + b" " + broken(oid)
              everything.put(header, data)
              if kind == b"blob":
                  for stream, rx in routes:
                      if any(rx.search(name) for name in blob_names.get(oid, ())):
                          stream.put(header, data)
          git.stdin.close()
          if git.stdout.read() or git.wait():
              fail("git cat-file failed")
          r = subprocess.run(["git", "rev-list", "--objects", "--all"], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE)
          if r.returncode:
              fail("git rev-list failed")
          for line in r.stdout.split(b"\n"):
              oid, _, path = line.partition(b" ")
              if line and not re.fullmatch(OID, oid):
                  fail("unexpected output of git rev-list")
              if path:
                  all_names.add(path)
          # Every complete path: each root walked with an empty prefix, each
          # folder with its own path as the prefix of its entries, and no
          # (tree, prefix) pair walked twice.
          walked = set()
          todo = [(root, b"") for root in roots]
          while todo:
              tree, prefix = todo.pop()
              if (tree, prefix) in walked:
                  continue
              walked.add((tree, prefix))
              for name, entry, folder in trees[tree]:
                  all_names.add(prefix + name)
                  if folder:
                      if entry not in trees:
                          fail("a folder of a tree is not in the object list")
                      todo.append((entry, prefix + name + b"/"))
          # Each distinct name is a record of its own, so no match runs across names.
          before = everything.records
          for name in sorted(all_names):
              everything.put(b"name", name)
          name_records = everything.records - before
          streams = [everything] + [stream for stream, _ in routes]
          size = sum(stream.close() for stream in streams)
          with open(sys.argv[3], "w") as f:
              f.write(f"{size}\n")
          parts = "; ".join(f"{s.name}: records {s.records}, blocks {s.blocks}" for s in streams)
          print(f"objects: {len(objects)}; {parts}; bytes in all: {size}; blob names checked: {len(names)}; "
                f"name records: {name_records}")
          PY
          log="$RUNNER_TEMP/gitleaks-objects.log"
          rc=0
          docker run --rm \
            -v "$objects:/objects:ro" \
            -v "$RUNNER_TEMP/gitleaks.toml:/config/gitleaks.toml:ro" \
            "$GITLEAKS_IMAGE" dir /objects \
            --config /config/gitleaks.toml \
            --ignore-gitleaks-allow --redact --no-banner 2>&1 | tee "$log" || rc=$?
          plain="$(sed 's/\x1b\[[0-9;]*m//g' "$log")"
          if grep -Eq '^[^ ]+ (ERR|FTL) ' <<< "$plain"; then
            echo "::error::gitleaks logged an error"
            exit 1
          fi
          expected="$(cat "$total")"
          if ! grep -Eq "^[^ ]+ INF scanned ~$expected bytes " <<< "$plain"; then
            echo "::error::gitleaks did not scan every stream in full"
            exit 1
          fi
          exit "$rc"

      - name: gitleaks dir (working tree)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/gitleaks-tree.log"
          rc=0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks.toml:/config/gitleaks.toml:ro" \
            "$GITLEAKS_IMAGE" dir /repo \
            --config /config/gitleaks.toml \
            --ignore-gitleaks-allow --redact --no-banner 2>&1 | tee "$log" || rc=$?
          plain="$(sed 's/\x1b\[[0-9;]*m//g' "$log")"
          if grep -Eq '^[^ ]+ (ERR|FTL) ' <<< "$plain"; then
            echo "::error::gitleaks logged an error"
            exit 1
          fi
          if ! grep -Eq '^[^ ]+ INF scanned ~[1-9][0-9]* bytes' <<< "$plain"; then
            echo "::error::gitleaks did not report any scanned bytes"
            exit 1
          fi
          exit "$rc"

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hygiene (tree)
        run: python3 -I tools/hygiene.py

      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [ "$REF" = refs/heads/main ]; then
            # main takes changes only through pull requests, so its previous
            # tip is always a known commit; anything else fails closed.
            if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "::error::previous tip of main is not a commit in the history"
              exit 1
            fi
            base="$BEFORE"
            head="$SHA"
          else
            # The whole branch, not only this push, so a later push cannot
            # hide an earlier commit of the branch.
            base="$(git merge-base origin/main "$SHA")"
            head="$SHA"
          fi
          echo "range=$base..$head" >> "$GITHUB_OUTPUT"

      - name: Hygiene (range)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python3 -I tools/hygiene.py --range "$RANGE"

  # The unit tests on Linux and Windows, for each supported Python version.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  # The one check the ruleset requires for the unit tests: its name stays
  # the same when the matrix changes. It also reads the conclusion of each
  # test job of the run, since a job cancelled before any runner took it
  # leaves needs.test.result at success.
  tests:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Every test job passed
        env:
          RESULT: ${{ needs.test.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$RESULT" != success ]; then
            echo "::error::test jobs: $RESULT"
            exit 1
          fi
          # The latest attempt of each job, so a re-run of the failed jobs
          # counts the jobs that passed in an earlier attempt; one conclusion
          # per line, counted here, so every page counts. A job without a
          # conclusion gives "none": gh prints null as an empty line, and the
          # shell drops empty lines at the end of the output.
          conclusions="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name | startswith("test (")) | (.conclusion // "none")')"
          total=0
          passed=0
          if [ -n "$conclusions" ]; then
            while IFS= read -r conclusion; do
              total=$((total + 1))
              if [ "$conclusion" = success ]; then
                passed=$((passed + 1))
              fi
            done <<< "$conclusions"
          fi
          if [ "$total" -eq 0 ] || [ "$passed" -ne "$total" ]; then
            echo "::error::test jobs: $passed of $total succeeded"
            exit 1
          fi

  identity:
    # Branch pushes other than main in this repository (not in a fork), and
    # pull requests from this repository.
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main' &&
       github.event.repository.fork == false) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [ "$REF" = refs/heads/main ]; then
            # main takes changes only through pull requests, so its previous
            # tip is always a known commit; anything else fails closed.
            if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "::error::previous tip of main is not a commit in the history"
              exit 1
            fi
            base="$BEFORE"
            head="$SHA"
          else
            # The whole branch, not only this push, so a later push cannot
            # hide an earlier commit of the branch.
            base="$(git merge-base origin/main "$SHA")"
            head="$SHA"
          fi
          echo "range=$base..$head" >> "$GITHUB_OUTPUT"

      # Identities are compared raw (no mailmap) and never printed: a public
      # log must not repeat a wrong identity.
      - name: Author and committer identity
        env:
          RANGE: ${{ steps.range.outputs.range }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          owner='SharpBit Studio <66270150+sharpbitstudio@users.noreply.github.com>'
          web='GitHub <noreply@github.com>'
          bot='dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>'
          allow_bot=0
          case "$BRANCH" in dependabot/*) allow_bot=1 ;; esac
          commits="$(git -c log.mailmap=false log --no-use-mailmap --format='%H%x09%an <%ae>%x09%cn <%ce>' "$RANGE")"
          bad=0
          while IFS=$'\t' read -r sha author committer; do
            [ -n "$sha" ] || continue
            if [ "$author" != "$owner" ] && ! { [ "$allow_bot" = 1 ] && [ "$author" = "$bot" ]; }; then
              echo "::error::commit $sha: author is not an allowed identity"
              bad=1
            fi
            if [ "$committer" != "$owner" ] && [ "$committer" != "$web" ]; then
              echo "::error::commit $sha: committer is not an allowed identity"
              bad=1
            fi
          done <<< "$commits"
          exit "$bad"
